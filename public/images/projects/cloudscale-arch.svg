<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .bg { fill: #0d131f; rx: 8px; }
      .box { fill: #172033; stroke: #334155; stroke-width: 1.5; rx: 6px; }
      .box-accent { fill: #142847; stroke: #38bdf8; stroke-width: 2; rx: 6px; }
      .box-data { fill: #132b26; stroke: #34d399; stroke-width: 1.5; rx: 6px; }
      .title { fill: #f8fafc; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 14px; font-weight: 600; }
      .sub { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; }
      .line-accent { stroke: #38bdf8; stroke-width: 2; marker-end: url(#arrow-blue); }
      .line-green { stroke: #34d399; stroke-width: 2; marker-end: url(#arrow-green); }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="960" height="420" class="bg"/>

  <text x="40" y="45" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1">ARCHITECTURE SCHEMATIC: CLOUDSCALE RECONCILIATION DAEMON</text>
  <text x="40" y="70" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">Declarative Desired State Loop with Blue/Green Signal Draining</text>

  <!-- Spec Ingest -->
  <g transform="translate(40, 150)">
    <rect width="140" height="90" class="box"/>
    <text x="70" y="40" text-anchor="middle" class="title">YAML Spec</text>
    <text x="70" y="62" text-anchor="middle" class="sub">GitOps Manifest</text>
  </g>

  <path d="M 180 195 L 240 195" class="line-accent"/>

  <!-- Core Daemon -->
  <g transform="translate(240, 110)">
    <rect width="250" height="180" class="box-accent"/>
    <text x="125" y="35" text-anchor="middle" class="title">Reconciliation Loop</text>
    <text x="125" y="55" text-anchor="middle" class="sub">CloudScale Daemon</text>
    <line x1="20" y1="75" x2="230" y2="75" stroke="#1e293b"/>
    <rect x="25" y="90" width="200" height="30" rx="4" fill="#0f172a"/>
    <text x="125" y="110" text-anchor="middle" class="sub">State Comparison Engine</text>
    <rect x="25" y="130" width="200" height="30" rx="4" fill="#0f172a"/>
    <text x="125" y="150" text-anchor="middle" class="sub">Readiness &amp; Health Probe</text>
  </g>

  <path d="M 490 170 L 560 170" class="line-accent"/>
  <path d="M 490 230 L 560 230" class="line-green"/>

  <!-- Linux Engine -->
  <g transform="translate(560, 120)">
    <rect width="180" height="150" class="box"/>
    <text x="90" y="35" text-anchor="middle" class="title">Docker API</text>
    <text x="90" y="55" text-anchor="middle" class="sub">Linux Cgroups / NS</text>
    <rect x="20" y="80" width="140" height="26" rx="4" fill="#0d131f"/>
    <text x="90" y="97" text-anchor="middle" class="sub">Container Blue (Active)</text>
    <rect x="20" y="112" width="140" height="26" rx="4" fill="#0d131f"/>
    <text x="90" y="129" text-anchor="middle" class="sub">Container Green (Next)</text>
  </g>

  <path d="M 740 195 L 800 195" class="line-accent"/>

  <!-- Reverse Proxy -->
  <g transform="translate(800, 145)">
    <rect width="130" height="100" class="box-data"/>
    <text x="65" y="40" text-anchor="middle" class="title">Local Proxy</text>
    <text x="65" y="60" text-anchor="middle" class="sub">Dynamic Route</text>
    <text x="65" y="80" text-anchor="middle" class="sub">Zero Downtime</text>
  </g>
</svg>
