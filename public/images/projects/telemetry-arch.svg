<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .bg { fill: #0d131f; rx: 8px; }
      .box { fill: #172033; stroke: #334155; stroke-width: 1.5; rx: 6px; }
      .box-accent { fill: #142847; stroke: #38bdf8; stroke-width: 2; rx: 6px; }
      .box-data { fill: #132b26; stroke: #34d399; stroke-width: 1.5; rx: 6px; }
      .title { fill: #f8fafc; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 14px; font-weight: 600; }
      .sub { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; }
      .line-accent { stroke: #38bdf8; stroke-width: 2; marker-end: url(#arrow-blue); }
      .line-green { stroke: #34d399; stroke-width: 2; marker-end: url(#arrow-green); }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="960" height="420" class="bg"/>

  <text x="40" y="45" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1">ARCHITECTURE SCHEMATIC: TELEMETRYSTREAM INGESTION TIER</text>
  <text x="40" y="70" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">Buffered Stream Ingestion with Relational Micro-Batch Copy Operations</text>

  <!-- Sources -->
  <g transform="translate(40, 150)">
    <rect width="130" height="90" class="box"/>
    <text x="65" y="40" text-anchor="middle" class="title">Services &amp; Apps</text>
    <text x="65" y="62" text-anchor="middle" class="sub">Structured JSON</text>
  </g>

  <path d="M 170 195 L 230 195" class="line-accent"/>

  <!-- Ingestion Tier -->
  <g transform="translate(230, 115)">
    <rect width="210" height="160" class="box-accent"/>
    <text x="105" y="35" text-anchor="middle" class="title">FastAPI Ingest API</text>
    <text x="105" y="55" text-anchor="middle" class="sub">Non-blocking Workers</text>
    <line x1="15" y1="75" x2="195" y2="75" stroke="#1e293b"/>
    <rect x="25" y="90" width="160" height="28" rx="4" fill="#0f172a"/>
    <text x="105" y="108" text-anchor="middle" class="sub">Token-Bucket Limiter</text>
    <rect x="25" y="125" width="160" height="28" rx="4" fill="#0f172a"/>
    <text x="105" y="143" text-anchor="middle" class="sub">Redis Stream Append</text>
  </g>

  <path d="M 440 195 L 500 195" class="line-accent"/>

  <!-- Buffer Layer -->
  <g transform="translate(500, 130)">
    <rect width="170" height="130" class="box-data"/>
    <text x="85" y="35" text-anchor="middle" class="title">Redis Stream</text>
    <text x="85" y="55" text-anchor="middle" class="sub">Backpressure Buffer</text>
    <rect x="15" y="75" width="140" height="35" rx="4" fill="#0b1e19"/>
    <text x="85" y="97" text-anchor="middle" class="sub">Consumer Groups</text>
  </g>

  <path d="M 670 195 L 730 195" class="line-green"/>

  <!-- Storage Engine -->
  <g transform="translate(730, 120)">
    <rect width="190" height="150" class="box"/>
    <text x="95" y="35" text-anchor="middle" class="title">PostgreSQL Store</text>
    <text x="95" y="55" text-anchor="middle" class="sub">Timescale Partitioning</text>
    <line x1="15" y1="75" x2="175" y2="75" stroke="#334155"/>
    <rect x="20" y="90" width="150" height="25" rx="4" fill="#0d131f"/>
    <text x="95" y="107" text-anchor="middle" class="sub">Binary COPY Batches</text>
    <rect x="20" y="120" width="150" height="20" rx="4" fill="#0d131f"/>
    <text x="95" y="135" text-anchor="middle" class="sub">Aggregated Rollups</text>
  </g>
</svg>
