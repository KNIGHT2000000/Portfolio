<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .bg { fill: #0d131f; rx: 8px; }
      .box { fill: #172033; stroke: #334155; stroke-width: 1.5; rx: 6px; }
      .box-accent { fill: #142847; stroke: #38bdf8; stroke-width: 2; rx: 6px; }
      .box-data { fill: #132b26; stroke: #34d399; stroke-width: 1.5; rx: 6px; }
      .title { fill: #f8fafc; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 14px; font-weight: 600; }
      .sub { fill: #94a3b8; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 11px; }
      .line { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .line-accent { stroke: #38bdf8; stroke-width: 2; marker-end: url(#arrow-blue); }
      .line-emerald { stroke: #34d399; stroke-width: 2; marker-end: url(#arrow-green); }
      .badge { fill: #38bdf8; font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px; font-weight: bold; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="960" height="420" class="bg"/>

  <!-- Client -->
  <g transform="translate(40, 160)">
    <rect width="130" height="80" class="box"/>
    <text x="65" y="38" text-anchor="middle" class="title">API Client</text>
    <text x="65" y="58" text-anchor="middle" class="sub">Idempotent POST</text>
  </g>

  <!-- Flow 1 -->
  <path d="M 170 200 L 230 200" class="line-accent"/>

  <!-- Core Service -->
  <g transform="translate(230, 120)">
    <rect width="210" height="160" class="box-accent"/>
    <text x="105" y="35" text-anchor="middle" class="title">Payment Ingestion</text>
    <text x="105" y="55" text-anchor="middle" class="sub">Spring Boot Service</text>
    <line x1="15" y1="75" x2="195" y2="75" stroke="#1e293b"/>
    <rect x="25" y="90" width="160" height="28" rx="4" fill="#0f172a"/>
    <text x="105" y="108" text-anchor="middle" class="sub">Idempotency Validator</text>
    <rect x="25" y="124" width="160" height="26" rx="4" fill="#0f172a"/>
    <text x="105" y="141" text-anchor="middle" class="sub">Transactional Outbox</text>
  </g>

  <!-- Flow down to DB -->
  <path d="M 335 280 L 335 320" class="line-emerald"/>

  <!-- Database & Cache -->
  <g transform="translate(230, 320)">
    <rect width="210" height="65" class="box-data"/>
    <text x="105" y="28" text-anchor="middle" class="title">PostgreSQL + Redis</text>
    <text x="105" y="48" text-anchor="middle" class="sub">Atomic Outbox &amp; Lease</text>
  </g>

  <!-- Flow 2 to Kafka -->
  <path d="M 440 200 L 510 200" class="line-accent"/>

  <!-- Kafka Cluster -->
  <g transform="translate(510, 120)">
    <rect width="180" height="160" class="box"/>
    <text x="90" y="35" text-anchor="middle" class="title">Apache Kafka</text>
    <text x="90" y="55" text-anchor="middle" class="sub">Partitioned Broker</text>
    <line x1="15" y1="75" x2="165" y2="75" stroke="#334155"/>
    <rect x="20" y="90" width="140" height="26" rx="4" fill="#0d131f"/>
    <text x="90" y="107" text-anchor="middle" class="sub">Topic: payment-orders</text>
    <rect x="20" y="124" width="140" height="26" rx="4" fill="#0d131f"/>
    <text x="90" y="141" text-anchor="middle" class="sub">Topic: payment-dlq</text>
  </g>

  <!-- Flow 3 to Downstream Worker -->
  <path d="M 690 200 L 760 200" class="line-accent"/>

  <!-- Gateway Settlement Worker -->
  <g transform="translate(760, 140)">
    <rect width="160" height="120" class="box"/>
    <text x="80" y="38" text-anchor="middle" class="title">Settlement Worker</text>
    <text x="80" y="58" text-anchor="middle" class="sub">Consumer Group</text>
    <rect x="15" y="75" width="130" height="30" rx="4" fill="#142847"/>
    <text x="80" y="95" text-anchor="middle" class="sub">Bank Gateway Dispatch</text>
  </g>

  <!-- Header Label -->
  <text x="40" y="45" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="12" letter-spacing="1">ARCHITECTURE SCHEMATIC: RESIPAY TRANSACTIONAL OUTBOX</text>
  <text x="40" y="70" fill="#64748b" font-family="ui-monospace, monospace" font-size="11">Decoupled Asynchronous Settlement with Idempotency Guarantees</text>
</svg>
