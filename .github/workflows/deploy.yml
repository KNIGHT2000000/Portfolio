name: Deploy Portfolio to GitHub Pages

on:
  # Sync + deploy on every push to main
  push:
    branches: [main, master]

  # Scheduled sync: runs nightly at 02:00 UTC to pick up new/updated GitHub repos
  schedule:
    - cron: '0 2 * * *'

  # Allow manual trigger from the Actions tab (useful for on-demand sync)
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between in-progress and latest.
# Do NOT cancel in-progress runs — we want deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Sync GitHub Repos & Build Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # ── Phase 2: Sync GitHub portfolio repositories ──────────────
      # This step fetches repositories tagged with "portfolio" topic
      # from GitHub and writes src/data/generated-projects.json
      #
      # GITHUB_TOKEN is the automatic Actions token — no extra secrets needed.
      # It provides 5000 requests/hr (vs 60 for anonymous requests).
      # Set GITHUB_USERNAME in your repository's Actions Variables:
      #   Settings → Secrets and variables → Actions → Variables → New variable
      #   Name: GITHUB_USERNAME  Value: <your-github-username>
      - name: Sync GitHub Portfolio Repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME || github.repository_owner }}
        run: node scripts/sync-github.mjs

      # ── Build ──────────────────────────────────────────────────────
      - name: Build Astro Static Site
        run: npm run build

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
